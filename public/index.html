<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0084FF">
<meta name="description" content="Ứng dụng nhắn tin thời gian thực lấy cảm hứng từ Messenger">
<title>ChitChat — Nhắn tin thời gian thực</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ============ MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ ============ -->
<div id="auth-view" class="auth-view hidden">
  <div class="auth-card">
    <div class="auth-logo">💬</div>
    <h1>ChitChat</h1>
    <p class="auth-sub">Nhắn tin thời gian thực, nhanh như chớp</p>
    <div class="auth-tabs">
      <button id="tab-login" class="auth-tab active">Đăng nhập</button>
      <button id="tab-register" class="auth-tab">Đăng ký</button>
    </div>
    <form id="auth-form">
      <div id="name-field" class="field hidden">
        <input type="text" id="auth-name" placeholder="Họ và tên" autocomplete="name">
      </div>
      <div class="field">
        <input type="email" id="auth-email" placeholder="Email" autocomplete="email" required>
      </div>
      <div class="field">
        <input type="password" id="auth-pass" placeholder="Mật khẩu" autocomplete="current-password" required>
      </div>
      <p id="auth-error" class="auth-error hidden"></p>
      <button type="submit" id="auth-submit" class="btn-primary">Đăng nhập</button>
    </form>
    <p class="auth-hint">Tài khoản demo: <b>demo1@demo.com</b> / <b>demo1234</b></p>
  </div>
</div>

<!-- ============ APP CHÍNH ============ -->
<div id="app-view" class="app hidden">
  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="me" id="me-block">
        <div class="avatar" id="me-avatar"></div>
        <div class="me-info">
          <div class="me-name" id="me-name"></div>
          <div class="me-status">Đang hoạt động</div>
        </div>
      </div>
      <div class="sidebar-actions">
        <button id="btn-new-chat" class="icon-btn" title="Tin nhắn mới">✎</button>
        <button id="btn-logout" class="icon-btn" title="Đăng xuất">⏻</button>
      </div>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Tìm kiếm cuộc trò chuyện hoặc người dùng">
    </div>
    <div id="conv-list" class="conv-list"></div>
    <div id="user-results" class="user-results hidden"></div>
  </aside>

  <!-- Khung chat -->
  <main id="chat-pane" class="chat-pane">
    <div id="chat-empty" class="chat-empty">
      <div class="chat-empty-icon">💬</div>
      <h2>Tin nhắn của bạn</h2>
      <p>Chọn một cuộc trò chuyện hoặc tìm người dùng để bắt đầu chat.</p>
    </div>

    <div id="chat-active" class="chat-active hidden">
      <div class="chat-header">
        <button id="btn-back" class="icon-btn back-btn">←</button>
        <div class="avatar" id="chat-avatar"></div>
        <div class="chat-peer">
          <div class="chat-peer-name" id="chat-name"></div>
          <div class="chat-peer-status" id="chat-status"></div>
        </div>
      </div>

      <div id="messages" class="messages"></div>
      <div id="typing-bar" class="typing-bar hidden">
        <div class="avatar avatar-xs" id="typing-avatar"></div>
        <div class="typing-bubble"><span></span><span></span><span></span></div>
      </div>

      <div class="composer">
        <div id="emoji-panel" class="emoji-panel hidden"></div>
        <button id="btn-emoji" class="icon-btn" title="Emoji">😊</button>
        <button id="btn-attach" class="icon-btn" title="Gửi ảnh">🖼️</button>
        <input type="file" id="file-input" accept="image/png,image/jpeg,image/gif,image/webp" class="hidden">
        <input type="text" id="msg-input" placeholder="Nhắn tin..." autocomplete="off" maxlength="2000">
        <button id="btn-send" class="icon-btn send-btn" title="Gửi">➤</button>
      </div>
    </div>
  </main>
</div>

<!-- Lightbox xem ảnh -->
<div id="lightbox" class="lightbox hidden">
  <button id="lightbox-close" class="icon-btn lightbox-close">✕</button>
  <img id="lightbox-img" src="" alt="Ảnh">
</div>

<div id="toast" class="toast hidden"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
